<svg width="64" height="64" viewBox="0 0 64 64" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vibrix">
  <title>Vibrix</title>
  <!--
    Transparent on purpose: the old dark tile was a plate baked into the art.
    What the tile was actually doing was keeping the neutral strokes legible on
    a light tab strip, so that job moves to a media query — cyan and magenta
    read on both grounds, only the near-white needs to flip. Browsers that
    ignore media queries in an SVG favicon (Safari) fall back to the PNG icons,
    which keep their tile because a home-screen icon is supposed to have one.
  -->
  <style>
    .n { stroke: #F2F3F5; }
    @media (prefers-color-scheme: light) { .n { stroke: #14171d; } }
  </style>
  <mask id="pierce">
    <rect x="0" y="0" width="64" height="64" fill="white"/>
    <path d="M6 18 L32 50 L58 18" fill="none" stroke="black" stroke-width="9.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <g mask="url(#pierce)" fill="none">
    <circle class="n" cx="32" cy="32" r="27" stroke-width="3.2"/>
    <circle cx="32" cy="32" r="19.5" stroke="#21dde8" stroke-width="2.6"/>
    <circle cx="32" cy="32" r="10" stroke="#f0409b" stroke-width="2.4"/>
    <circle class="n" cx="32" cy="32" r="1.3" stroke-width="2.6"/>
  </g>
  <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 18 L32 50 L58 18" stroke="#f0409b" transform="translate(-3 0)"/>
    <path d="M6 18 L32 50 L58 18" stroke="#21dde8" transform="translate(3 0)"/>
    <path class="n" d="M6 18 L32 50 L58 18"/>
  </g>
</svg>
